version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cinema_backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=http://91.99.222.189
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-25}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinema_network
    # No volumes in production: image is self-contained

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NUXT_PUBLIC_API_BASE=/api
        - SOCKET_URL=http://91.99.222.189:3002
    container_name: cinema_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - realtime
    networks:
      - cinema_network

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile.prod
    container_name: cinema_realtime
    restart: unless-stopped
    networks:
      - cinema_network

  db:
    image: mysql:8.0
    container_name: cinema_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cinema_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: cinema_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - realtime
    networks:
      - cinema_network

networks:
  cinema_network:
    driver: bridge

volumes:
  db_data:
