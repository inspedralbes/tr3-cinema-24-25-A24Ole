name: Build and Deploy to Production

on:
  push:
    branches:
      - main
      - deploy # For testing deployments on a staging branch
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:buildcache,mode=max

      # Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:buildcache,mode=max

      # Build and push realtime image
      - name: Build and push realtime image
        uses: docker/build-push-action@v5
        with:
          context: ./realtime
          file: ./realtime/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/realtime:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          script: |
            set -e

            # Navigate to project directory
            cd ${{ secrets.DEPLOY_PATH || '/home/app/cinema' }}

            # Log in to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest compose file from main branch
            git fetch origin
            git checkout origin/main -- docker-compose.prod.yml nginx/

            # Pull the new images
            docker pull $REGISTRY/$IMAGE_NAME/backend:$GITHUB_SHA
            docker pull $REGISTRY/$IMAGE_NAME/frontend:$GITHUB_SHA
            docker pull $REGISTRY/$IMAGE_NAME/realtime:$GITHUB_SHA

            # Tag as latest
            docker tag $REGISTRY/$IMAGE_NAME/backend:$GITHUB_SHA $REGISTRY/$IMAGE_NAME/backend:latest
            docker tag $REGISTRY/$IMAGE_NAME/frontend:$GITHUB_SHA $REGISTRY/$IMAGE_NAME/frontend:latest
            docker tag $REGISTRY/$IMAGE_NAME/realtime:$GITHUB_SHA $REGISTRY/$IMAGE_NAME/realtime:latest

            # Stop old containers gracefully (give 30s timeout)
            docker-compose -f docker-compose.prod.yml down -t 30 || true

            # Update docker-compose to use the new image SHA
            export BACKEND_IMAGE=$REGISTRY/$IMAGE_NAME/backend:$GITHUB_SHA
            export FRONTEND_IMAGE=$REGISTRY/$IMAGE_NAME/frontend:$GITHUB_SHA
            export REALTIME_IMAGE=$REGISTRY/$IMAGE_NAME/realtime:$GITHUB_SHA

            # Start new containers
            docker-compose -f docker-compose.prod.yml up -d

            # Wait for services to be healthy
            sleep 10

            # Run migrations
            docker-compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

            # Clear old images (keep last 5)
            docker image prune -a --force --filter "until=240h" || true

            # Log success
            echo "✅ Deployment completed successfully at $(date)"

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to production: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
